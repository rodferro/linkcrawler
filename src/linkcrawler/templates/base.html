<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LinkCrawler{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/"><span class="logo" aria-hidden="true">⟡</span> LinkCrawler</a>
      <nav><a href="/">Crawls</a><a href="/docs">API</a></nav>
    </div>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
